
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080713">
<title>Ads Platform | Member Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at 15% 15%, #34135b 0%, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #073c50 0%, transparent 45%),
    #080713;
}

.login-box {
  width: 100%;
  max-width: 410px;
  padding: 35px 28px;
  border: 1px solid rgba(0,229,255,.3);
  border-radius: 22px;
  background: rgba(17,15,35,.94);
  box-shadow: 0 0 45px rgba(0,229,255,.12),
              0 0 55px rgba(168,85,247,.12);
}

.logo {
  text-align: center;
  font-size: 34px;
  margin-bottom: 15px;
}

.logo span {
  color: #00e5ff;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aaa7bd;
  font-size: 13px;
  margin-bottom: 30px;
}

label {
  display: block;
  margin: 17px 0 9px;
  font-size: 13px;
  color: #d7d3e7;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #34314d;
  border-radius: 11px;
  outline: none;
  background: #0c0b19;
  color: white;
  font-size: 15px;
}

input:focus {
  border-color: #00e5ff;
  box-shadow: 0 0 12px rgba(0,229,255,.15);
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 25px;
  border: none;
  border-radius: 11px;
  background: linear-gradient(100deg,#a855f7,#00cfe8);
  color: #080713;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#message {
  color: #ffb7b7;
  font-size: 13px;
  text-align: center;
  margin-top: 15px;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #77738e;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">ADS<span>+</span></div>

  <h1>Member Login</h1>

  <p class="subtitle">
    Welcome back! Access your member dashboard.
  </p>

  <form id="loginForm">

    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      placeholder="Enter your username"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit">LOGIN NOW →</button>

    <p id="message"></p>

  </form>

  <div class="footer">
    SECURE MEMBER ACCESS
    <br><br>
    © 2026 Ads Platform. All rights reserved.
  </div>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("message").textContent =
    "Secure login system will be activated after database setup.";
});
</script>

</body>
</html>
